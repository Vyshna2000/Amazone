{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }
    body {
        margin: 0;
        background-color: #e8eaeb;
    }
    .page {
        text-align: center;
        padding-top: 40px;
    }
    .logo {
        height: 50px;
        margin-bottom: 20px;
    }
    .card {
        width: 420px;
        max-width: 90%;
        margin: auto;
        background: #fff;
        padding: 25px 30px;
        border: 1px solid #d5d9d9;
        border-radius: 8px;
        text-align: left;
    }
    .title {
        margin: 0 0 20px 0;
        font-size: 28px;
        font-weight: 600;
        color: #111;
    }
    label {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
        margin-top: 12px;
        color: #111;
    }
    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #a6a6a6;
        border-radius: 4px;
        font-size: 15px;
    }
    .btn {
        width: 100%;
        background: #f7ca00;
        border: 1px solid #a88734;
        padding: 10px;
        font-size: 15px;
        border-radius: 7px;
        margin-top: 15px;
        cursor: pointer;
    }
    .btn:hover {
        background: #f0c000;
    }
    .divider {
        height: 1px;
        background: #ddd;
        margin: 20px 0;
    }
    a {
        color: #007185;
        text-decoration: none;
    }
    .small {
        font-size: 12px;
        margin-top: 12px;
        color: #444;
        line-height: 1.4;
    }
    .signin {
        margin-top: 15px;
    }
</style>
</head>

<body>

<div class="page">

    <img src="{% static 'images/amaz.png' %}" alt="amazon" class="logo">

    <div class="card">

        <h2 class="title">Create Account</h2>

        <form method="POST" action="{% url 'signup_action' %}">

            {% csrf_token %}

            <label>Your name</label>
            <input type="text" name="name" required>

            <label>Mobile numbers</label>
            <input type="text" name="mobile" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button class="btn" type="submit">Verify mobile number</button>
        </form>

        <div class="divider"></div>

        <p><strong>Buying for work?</strong></p>
        <a href="#">Create a free business account</a>

        <p class="signin">
            Already have an account?
            <a href="/login/">Sign in</a>
        </p>

        <p class="small">
            By creating an account or logging in, you agree to Amazon's
            <a href="#">Conditions of Use</a> and
            <a href="#">Privacy Notice</a>.
        </p>

    </div>

</div>

</body>
</html>
