{% load static %}

<style>
    /* ---------------- Header CSS ---------------- */
    .header {
        background-color: #131921;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
    }

    .logo img {
        width: 100px;
        cursor: pointer;
    }

    .search-box {
        display: flex;
        flex: 1;
        max-width: 600px;
        margin: 0 20px;
    }

    .search-box select,
    .search-box input,
    .search-box button {
        padding: 10px;
        border: none;
        outline: none;
    }

    .search-box select {
        background: #e6e6e6;
        border-radius: 5px 0 0 5px;
    }

    .search-box input {
        flex: 1;
        background: white;
    }

    .search-box button {
        background: #febd69;
        cursor: pointer;
        border-radius: 0 5px 5px 0;
    }

    .right-menu {
        display: flex;
        gap: 20px;
        font-size: 14px;
        cursor: pointer;
    }

    .right-menu div:hover {
        text-decoration: underline;
    }

    @media(max-width: 768px) {
        .header {
            flex-wrap: wrap;
            gap: 10px;
        }
        .search-box {
            max-width: 100%;
            margin: 10px 0;
        }
    }
</style>

<header class="header">
    
    <div class="logo">
        <a href="{% url 'products' %}">
            <img src="{% static 'images/logo.png' %}" alt="Amazon Logo">
        </a>
    </div>

   <div class="search-box">
    <form method="GET" action="{% url 'products' %}" style="display:flex; width:100%;">
        <select class="search-select" name="category">
            <option value="">All</option>
            <option value="electronics">Electronics</option>
            <option value="books">Books</option>
            <!-- Add more categories if needed -->
        </select>

        <input type="text" class="search-input" name="q" placeholder="Search Amazon.in" required>

        <button type="submit" class="search-button">🔍</button>
    </form>
</div>

<div class="right-menu">
    {% if user.is_authenticated %}
        <div>
            Hello, {{ user.first_name }}<br>
            <a href="{% url 'logout' %}" style="color:white; text-decoration:none; font-size:12px;">Logout</a>
        </div>
        <div>Returns<br>& Orders</div>
        <div>
            <a href="{% url 'cart' %}" style="color:white; text-decoration:none;">
                🛒 Cart
            </a>
        </div>
    {% else %}
        <a href="{% url 'signin' %}" style="color:white; text-decoration:none;">
            <div>Hello, Sign in<br>Account & Lists</div>
        </a>
    {% endif %}
</div>


</header>
