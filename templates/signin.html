{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f3f3f3;
            margin: 0;
            color: #111;
        }

        .page {
            display: flex;
            flex-direction: column;
            padding: 40px 16px;
        }

        .brand {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .logo {
            height: 48px;
        }

        .panel {
            width: 420px;
            max-width: 94%;
            margin: 0 auto;
            background: #fff;
            padding: 32px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .title {
            margin: 0 0 18px 0;
            font-size: 28px;
            font-weight: bold;
        }

        .label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid #cfcfcf;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .btn-primary {
            background: #f0c14b;
            border: 1px solid #a88734;
            padding: 10px 14px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        .small {
            font-size: 12px;
            margin-top: 16px;
        }

        .small a,
        .create,
        .need-help {
            color: #007185;
            text-decoration: none;
        }

        .signup {
            margin-top: 22px;
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="brand">
            <img src="{% static 'images/amaz.png' %}" alt="amazon" class="logo">
        </header>

        <main class="panel">
            <h1 class="title">Sign in</h1>

            <form method="POST" action="{% url 'signin_action' %}">

                {% csrf_token %}

                <label class="label" for="identifier">Email or Mobile Phone Number</label>
                <input type="text" id="identifier" name="identifier" class="input-field"
                    placeholder="Enter email or phone number" required>

                <button type="submit" class="btn-primary">Continue</button>
            </form>

            <p class="small">
                By continuing, you agree to Amazon's <a href="#">Conditions of Use</a>
                and <a href="#">Privacy Notice</a>.
            </p>

            <a class="need-help" href="#">Need help?</a>

            <section class="signup">
                <p>New to Amazon?</p>
                <a href="{% url 'signup' %}" class="create">Create your Amazon account</a>
                <div style="text-align:center; margin:10px 0; font-size:14px; color:#666;">
                    or
                </div>
<a href="{% url 'social:begin' 'google-oauth2' %}"
   style="
       width:100%;max-width:320px;height:45px;border:1px solid #d8d8d8;
       border-radius:5px;background:white;
       display:flex;align-items:center;justify-content:center;gap:10px;
       cursor:pointer;font-size:16px;font-weight:500;color:#444;text-decoration:none;
       margin:15px auto;
   ">
    <img src='https://developers.google.com/identity/images/g-logo.png'
         style="width:20px;height:20px;">
    Login with Google
</a>

            </section>
        </main>
    </div>
</body>

</html>
